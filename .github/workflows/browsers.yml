name: Browsers

# The browser journeys again in WebKit (the engine of Safari) and Firefox (S-17).
# Not a required check yet: it runs beside CI and is read before every merge.
# What each engine leaves out, and why: docs/BROWSERS.md.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: Journeys in ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, firefox]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: The core journeys this engine can play
        run: npm run test:e2e:${{ matrix.browser }}
