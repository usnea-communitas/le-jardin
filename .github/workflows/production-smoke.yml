name: Production smoke test

# Vercel reports every deployment to GitHub. After a successful production
# deployment this checks the live domain on the deployed commit: it must serve
# exactly this commit's index.html and game.fragment.html, and a player must get
# from the story cover through the first four acts and a gift to the seasonal
# challenge without console errors or failed requests. It never calls the
# Living Lesson API (every model call costs credit), runs after the deploy and
# never blocks it; a failure shows on the commit and in Actions.
on:
  deployment_status:

permissions:
  contents: read

# one queue per environment, so the Preview deployment of the same push cannot
# cancel the production check
concurrency:
  group: production-smoke-${{ github.event.deployment.environment }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Live site serves this build and plays
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Check https://permaculture-garden.vercel.app/ (one retry)
        env:
          GAME_URL: https://permaculture-garden.vercel.app/
          EXPECT_LOCAL_BUILD: "1"
        run: npm run test:production || { echo "::warning::First attempt failed; retrying once in 20 s."; sleep 20; npm run test:production; }
