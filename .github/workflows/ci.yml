name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build, check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generated files match the canonical source
        run: |
          npm run generate
          git diff --exit-code -- index.html game.fragment.html
      - run: npm test
