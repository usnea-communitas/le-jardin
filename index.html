  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

\n              <span style=\"display:inline-flex;align-items:center;gap:5px;background:#EFF4E2;border:1px solid #D8E4BC;padding:3px 10px 3px 5px;border-radius:20px;font-size:11px;font-weight:600;color:#4E6B3D\">\n                <span style=\"width:19px;height:19px;display:block\">{{ sc.art }}<\u002Fspan>{{ sc.name }}\n              <\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ hasGuilds }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size:9.5px;font-weight:700;color:#9A8F77;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px\">Guilds discovered<\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px\">\n            <sc-for list=\"{{ sumGuilds }}\" as=\"sg\" hint-placeholder-count=\"2\">\n              <span style=\"background:#FBF3DC;border:1px solid #E0C583;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;color:#8A6A1F\">{{ sg }}<\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ hasStrengths }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"font-size:9.5px;font-weight:700;color:#5E7E4A;letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px\">What you did beautifully<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:4px;margin-bottom:12px\">\n            <sc-for list=\"{{ sumStrengths }}\" as=\"stg\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex;align-items:flex-start;gap:7px;font-size:12px;color:#4A4334;line-height:1.4\"><svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#5E7E4A\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;margin-top:2px\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>{{ stg }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ hasImprove }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size:9.5px;font-weight:700;color:#B5882F;letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px\">Seeds for next time<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:4px;margin-bottom:13px\">\n            <sc-for list=\"{{ sumImprove }}\" as=\"imp\" hint-placeholder-count=\"2\">\n              <div style=\"display:flex;align-items:flex-start;gap:7px;font-size:12px;color:#6E6552;line-height:1.4\"><span style=\"flex:none;margin-top:1px\">🌱<\u002Fspan>{{ imp }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ perfectGarden }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;align-items:center;gap:8px;background:#EAF1DC;border:1px solid #CFE0AC;border-radius:12px;padding:9px 13px;margin-bottom:13px;font-size:12px;color:#3E5A33;font-weight:600\">🏆 A complete permaculture garden — the earth, the people and the future all cared for.<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid #EADDBE;padding-top:12px\">\n          <div style=\"font-size:10.5px;color:#9A8F77;line-height:1.4\">{{ sumDate }} · Erasmus+ ecology project<br>Care for the earth · Care for people · Fair share<\u002Fdiv>\n          <div style=\"font-size:10.5px;color:#B5882F;font-weight:700;text-align:right;line-height:1.35\">📸 Screenshot me &amp;<br>show your friends!<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- Intro / how-to-play overlay -->\n  <sc-if value=\"{{ introVisible }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:absolute;inset:0;background:rgba(44,53,37,.5);backdrop-filter:blur(5px);display:grid;place-items:center;z-index:60;padding:24px\">\n      <div style=\"width:min(560px,94vw);background:#FBF8F1;border:1px solid #E7DECB;border-radius:22px;padding:28px 30px;box-shadow:0 30px 70px -30px rgba(20,25,12,.7);animation:floatIn .35s ease\">\n        <div style=\"display:flex;align-items:center;gap:13px;margin-bottom:14px\">\n          <div style=\"width:44px;height:44px;border-radius:13px;background:linear-gradient(150deg,#688A50,#3F5C33);display:grid;place-items:center;flex:none\"><svg width=\"25\" height=\"25\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#EAF3DC\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 19c0-8 5-13 14-14-1 9-6 14-14 14z\"><\u002Fpath><path d=\"M5 19c1-5 4-8 8-9\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n          <div>\n            <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:23px;letter-spacing:-.015em;line-height:1.1\">Welcome to Le Jardin<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:#8A7E66;margin-top:2px\">You're designing a real permaculture garden in France — together.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:6px;margin-bottom:16px\">\n          <span style=\"flex:1;text-align:center;background:#EAF1DC;color:#4E6B3D;font-size:11px;font-weight:700;padding:6px 4px;border-radius:9px\">🌍 Care for the earth<\u002Fspan>\n          <span style=\"flex:1;text-align:center;background:#F4EBDD;color:#A0713F;font-size:11px;font-weight:700;padding:6px 4px;border-radius:9px\">🤝 Care for people<\u002Fspan>\n          <span style=\"flex:1;text-align:center;background:#F6EFD9;color:#9A7B2E;font-size:11px;font-weight:700;padding:6px 4px;border-radius:9px\">🌾 Fair share<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:11px;margin-bottom:18px\">\n          <div style=\"display:flex;gap:11px;align-items:flex-start\"><span style=\"width:24px;height:24px;border-radius:8px;background:#5E7E4A;color:#F2E9D2;display:grid;place-items:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:12.5px;flex:none\">1<\u002Fspan><div style=\"font-size:13px;line-height:1.5;color:#4A4334\"><b>Build the garden.<\u002Fb> Drag compost, beds, water and habitats onto the plot. Every element teaches you why it matters.<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:11px;align-items:flex-start\"><span style=\"width:24px;height:24px;border-radius:8px;background:#5E7E4A;color:#F2E9D2;display:grid;place-items:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:12.5px;flex:none\">2<\u002Fspan><div style=\"font-size:13px;line-height:1.5;color:#4A4334\"><b>Share, don't just spend.<\u002Fb> Most things can be built through community barter (♻). What you give circulates — and comes back to you.<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:11px;align-items:flex-start\"><span style=\"width:24px;height:24px;border-radius:8px;background:#5E7E4A;color:#F2E9D2;display:grid;place-items:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:12.5px;flex:none\">3<\u002Fspan><div style=\"font-size:13px;line-height:1.5;color:#4A4334\"><b>Take what you need — not more.<\u002Fb> Neighbours leave surplus on the sharing table. Taking only what your garden needs keeps abundance flowing for everyone.<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:11px;align-items:flex-start\"><span style=\"width:24px;height:24px;border-radius:8px;background:#C99A3C;color:#FFF8E8;display:grid;place-items:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:12.5px;flex:none\">4<\u002Fspan><div style=\"font-size:13px;line-height:1.5;color:#4A4334\"><b>Pair up elements — discover guilds. ✦<\u002Fb> In permaculture, good neighbours help each other. Place related elements side by side and see what they create together. There are 7 to find!<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:11.5px;color:#8A7E66;font-style:italic;line-height:1.5;border-top:1px solid #EFE7D6;padding-top:12px;margin-bottom:16px\">In a gift economy, wealth isn't what you keep — it's having enough to give. Watch life arrive as your garden begins to share.<\u002Fdiv>\n        <button sc-camel-on-click=\"{{ onStartIntro }}\" style=\"width:100%;background:linear-gradient(150deg,#688A50,#3F5C33);border:none;color:#F2E9D2;font-weight:700;font-size:15px;padding:13px;border-radius:13px;cursor:pointer;font-family:'Bricolage Grotesque',sans-serif;letter-spacing:.01em;box-shadow:0 10px 22px -10px rgba(63,92,51,.8);transition:transform .15s\" style-hover=\"transform:translateY(-2px)\">{{ introBtnLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ showGuildList }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ onToggleGuildList }}\" style=\"position:absolute;inset:0;background:rgba(44,53,37,.5);backdrop-filter:blur(4px);z-index:56;display:flex;justify-content:flex-end;align-items:center;padding:22px;animation:gfade .2s ease\">\n      <div sc-camel-on-click=\"{{ stopProp }}\" style=\"width:min(340px,90%);max-height:84%;background:#FBF8F1;border:1px solid #E0C583;border-radius:18px;box-shadow:0 24px 60px -24px rgba(80,60,10,.6);display:flex;flex-direction:column;overflow:hidden;animation:gslideR .32s cubic-bezier(.2,.7,.3,1)\">\n        <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:17px 19px 13px;border-bottom:1px solid #EFE2C6;flex:none\">\n          <div style=\"min-width:0\">\n            <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:18px;color:#2C3525;line-height:1.1\">✦ Plant guilds<\u002Fdiv>\n            <div style=\"font-size:11.5px;color:#9A8F77;margin-top:3px;line-height:1.4\">{{ guildCount }}/7 discovered · place two partners side by side to form one<\u002Fdiv>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ onToggleGuildList }}\" title=\"Close\
