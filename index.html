  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

\n            <div style=\"font-size:13px;line-height:1.5;max-width:235px\">Pick or drop an element to learn what it does and why it belongs in a permaculture garden.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsection>\n    <\u002Fdiv>\n  <\u002Fmain>\n\n  <!-- Garden summary / certificate overlay -->\n  <sc-if value=\"{{ showSummary }}\" hint-placeholder-val=\"{{ false }}\">\n    <div onclick=\"{{ onCloseSummary }}\" style=\"position:absolute;inset:0;background:rgba(44,53,37,.55);backdrop-filter:blur(5px);display:grid;place-items:center;z-index:70;padding:20px;overflow-y:auto\">\n      <div onclick=\"{{ stopProp }}\" style=\"width:min(520px,94vw);background:linear-gradient(170deg,#FDFBF5,#F6F0E1);border:2px solid #C99A3C;border-radius:22px;padding:24px 28px;box-shadow:0 30px 70px -28px rgba(20,25,12,.8);animation:floatIn .4s ease;position:relative\">\n        <button onclick=\"{{ onCloseSummary }}\" title=\"Close\" style=\"position:absolute;top:13px;right:13px;width:28px;height:28px;border-radius:9px;background:transparent;border:1px solid #E0D6C2;color:#9A8F77;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s\" style-hover=\"border-color:#B5613A;color:#B5613A\">✕<\u002Fbutton>\n\n        <div style=\"text-align:center;margin-bottom:14px\">\n          <div style=\"font-size:9.5px;font-weight:700;color:#B5882F;letter-spacing:.22em;text-transform:uppercase;margin-bottom:5px\">Le Jardin · Permaculture garden<\u002Fdiv>\n          <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:25px;letter-spacing:-.015em;color:#2C3525;line-height:1.05\">Gardener's Certificate<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;justify-content:center;gap:8px;margin-top:9px\">\n            <span style=\"height:1px;width:44px;background:#DCC98F\"><\u002Fspan>\n            <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#C99A3C\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 19c0-8 5-13 14-14-1 9-6 14-14 14z\"><\u002Fpath><path d=\"M5 19c1-5 4-8 8-9\"><\u002Fpath><\u002Fsvg>\n            <span style=\"height:1px;width:44px;background:#DCC98F\"><\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:15px\">\n          <span style=\"font-size:12px;color:#8A7E66;font-weight:500\">grown with care by<\u002Fspan>\n          <input value=\"{{ playerName }}\" onchange=\"{{ onNameChange }}\" placeholder=\"your name\" style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:17px;color:#2C3525;background:transparent;border:none;border-bottom:2px dotted #C99A3C;outline:none;padding:1px 6px;width:170px;text-align:center\">\n        <\u002Fdiv>\n\n        <div style=\"position:relative;height:150px;border-radius:14px;overflow:hidden;margin-bottom:12px;background:radial-gradient(42% 32% at 24% 28%,rgba(219,235,176,.9),transparent 70%),radial-gradient(38% 30% at 76% 62%,rgba(148,182,106,.55),transparent 70%),linear-gradient(162deg,#C6DB9F 0%,#AECB84 55%,#9CBE72 100%);box-shadow:inset 0 0 0 1px rgba(90,110,60,.3),inset 0 10px 24px -14px rgba(40,60,20,.45)\">\n          <svg viewBox=\"0 0 100 100\" preserveAspectRatio=\"none\" style=\"position:absolute;inset:0;width:100%;height:100%;pointer-events:none\">\n            <path d=\"M50 100 C 50 84, 46 74, 49 62 C 52 52, 50 46, 49 40\" stroke=\"#D9C9A4\" stroke-width=\"6\" fill=\"none\" stroke-linecap=\"round\" opacity=\".7\"><\u002Fpath>\n          <\u002Fsvg>\n          <div style=\"position:absolute;left:49%;top:40%;transform:translate(-50%,-96%);width:56px;pointer-events:none;z-index:2\">\n            <svg viewBox=\"0 0 160 184\" width=\"100%\">\n              <path d=\"M73 180c-4-30-3-56 2-76h6c5 20 6 46 2 76z\" fill=\"#8A5A33\"><\u002Fpath>\n              <circle cx=\"46\" cy=\"74\" r=\"31\" fill=\"#5C8C3A\"><\u002Fcircle><circle cx=\"114\" cy=\"76\" r=\"33\" fill=\"#5C8C3A\"><\u002Fcircle><circle cx=\"80\" cy=\"48\" r=\"37\" fill=\"#5C8C3A\"><\u002Fcircle><circle cx=\"80\" cy=\"92\" r=\"33\" fill=\"#5C8C3A\"><\u002Fcircle>\n              <circle cx=\"60\" cy=\"74\" r=\"21\" fill=\"#74A64C\"><\u002Fcircle><circle cx=\"102\" cy=\"72\" r=\"23\" fill=\"#74A64C\"><\u002Fcircle><circle cx=\"80\" cy=\"56\" r=\"25\" fill=\"#74A64C\"><\u002Fcircle>\n              <circle cx=\"58\" cy=\"92\" r=\"3.4\" fill=\"#D33E55\"><\u002Fcircle><circle cx=\"92\" cy=\"99\" r=\"3.4\" fill=\"#D33E55\"><\u002Fcircle><circle cx=\"74\" cy=\"104\" r=\"3.4\" fill=\"#D33E55\"><\u002Fcircle><circle cx=\"110\" cy=\"84\" r=\"3.2\" fill=\"#D33E55\"><\u002Fcircle>\n            <\u002Fsvg>\n          <\u002Fdiv>\n          <div style=\"position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:42px;pointer-events:none;z-index:2\">\n            <svg viewBox=\"0 0 120 78\" width=\"100%\">\n              <rect x=\"14\" y=\"20\" width=\"9\" height=\"54\" rx=\"3\" fill=\"#8A6A3F\"><\u002Frect><rect x=\"97\" y=\"20\" width=\"9\" height=\"54\" rx=\"3\" fill=\"#8A6A3F\"><\u002Frect>\n              <rect x=\"27\" y=\"40\" width=\"66\" height=\"34\" rx=\"3\" fill=\"#B58A52\"><\u002Frect>\n              <rect x=\"30\" y=\"14\" width=\"60\" height=\"13\" rx=\"3\" fill=\"#74552F\"><\u002Frect>\n            <\u002Fsvg>\n          <\u002Fdiv>\n          <sc-for list=\"{{ miniPlaced }}\" as=\"mp\" hint-placeholder-count=\"0\">\n            <div style=\"{{ mp.style }}\">{{ mp.art }}<\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-for list=\"{{ miniCritters }}\" as=\"mc\" hint-placeholder-count=\"0\">\n            <div style=\"{{ mc.style }}\">{{ mc.art }}<\u002Fdiv>\n          <\u002Fsc-for>\n          <div style=\"position:absolute;right:7px;bottom:6px;background:rgba(245,242,230,.85);padding:1px 8px;border-radius:8px;font-size:8.5px;font-weight:700;color:#5E7345;z-index:15\">Le Jardin<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;gap:16px;align-items:center;background:#FFFDF6;border:1px solid #EDE2C6;border-radius:15px;padding:13px 16px;margin-bottom:12px\">\n          <div style=\"flex:none\">{{ sumScore }}<\u002Fdiv>\n          <div style=\"flex:1;min-width:0\">\n            <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:16px;color:#2C3525;line-height:1.15\">{{ sumStatus }}<\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:9px;margin-top:6px;font-size:11px;color:#7A6E58;font-weight:600\">\n              <span>🐾 {{ sumCritterCount }}/10 wild neighbours<\u002Fspan>\n              <span>✦ {{ sumGuildCount }}/7 guilds<\u002Fspan>\n              <span>♻ {{ sumShares }} given<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ sumCritterCount }}\" hint-placeholder-val=\"{{ 0 }}\">\n          <div style=\"font-size:9.5px;font-weight:700;color:#9A8F77;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px\">Who moved in<\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px\">\n            <sc-for list=\"{{ sumCritters }}\" as=\"sc\" hint-placeholder-count=\"4\">\n              <span style=\"display:inline-flex;align-items:center;gap:5px;background:#EFF4E2;border:1px solid #D8E4BC;padding:3px 10px 3px 5px;border-radius:20px;font-size:11px;font-weight:600;color:#4E6B3D\">\n                <span style=\"width:19px;height:19px;display:block\">{{ sc.art }}<\u002Fspan>{{ sc.name }}\n              <\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ hasGuilds }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size:9.5px;font-weight:700;color:#9A8F77;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px\">Guilds discovered<\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px\">\n            <sc-for list=\"{{ sumGuilds }}\" as=\"sg\" hint-placeholder-count=\"2\">\n              <span style=\"background:#FBF3DC;border:1px solid #E0C583;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;color:#8A6A1F\">{{ sg }}<\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ hasStrengths }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"font-size:9.5px;font-weight:700;color:#5E7E4A;letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px\">What you did beautifully<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:4px;margin-bottom:12px\">\n            <sc-for list=\"{{ sumStrengths }}\" as=\"stg\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex;align-items:flex-start;gap:7px;font-size:12px;color:#4A4334;line-height:1.4\"><svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#5E7E4A\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;margin-top:2px\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>{{ stg }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ hasImprove }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size:9.5px;font-weight:700;color:#B5882F;letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px\">Seeds for next time<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:4px;margin-bottom:13px\">\n            <sc-for list=\"{{ sumImprove }}\" as=\"imp\" hint-placeholder-count=\"2\">\n              <div style=\"display:flex;align-items:flex-start;gap:7px;font-size:12px;color:#6E6552;line-height:1.4\"><span style=\"flex:none;margin-top:1px\">🌱<\u002Fspan>{{ imp }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ perfectGarden }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;align-items:center;gap:8px;background:#EAF1DC;border:1px solid #CFE0AC;border-radius:12px;padding:9px 13px;margin-bottom:13px;font-size:12px;color:#3E5A33;font-weight:600\">🏆 A complete permaculture garden — the earth, the people and the future all cared for.<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid #EADDBE;padding-top:12px\">\n          <div style=\"font-size:10.5px;color:#9A8F77;line-height:1.4\">{{ sumDate }} · Erasmus+ ecology project<br>Care for the earth · Care for people · Fair share<\u002Fdiv>\n          <div style=\"font-size:10.5px;color:#B5882F;font-weight:700;text-align:right;line-height:1.35\">📸 Screenshot me &amp;<br>show your friends!<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- Intro / how-to-play overlay -->\n  <sc-if value=\"{{ introVisible }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:absolute;inset:0;background:rgba(44,53,37,.5);backdrop-filter:blur(5px);display:grid;place-items:center;z-index:60;padding:24px\">\n      <div style=\"width:min(560px,94vw);background:#FBF8F1;border:1px solid #E7DECB;border-radius:22px;padding:28px 30px;box-shadow:0 30px 70px -30px rgba(20,25,12,.7);animation:floatIn .35s ease\">\n        <div style=\"display:flex;align-items:center;gap:13px;margin-bottom:14px\">\n          <div style=\"width:44px;height:44px;border-radius:13px;background:linear-gradient(150deg,#688A50,#3F5C33);display:grid;place-items:center;flex:none\"><svg width=\"25\" height=\"25\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#EAF3DC\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 19c0-8 5-13 14-14-1 9-6 14-14 14z\"><\u002Fpath><path d=\"M5 19c1-5 4-8 8-9\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n          <div>\n            <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:23px;letter-spacing:-.015em;line-height:1.1\">Welcome to Le Jardin<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:#8A7E66;margin-top:2px\">You're designing a real permaculture garden in France — together.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:6px;margin-bottom:16px\">\n          <span style=\"flex:1;text-align:center;background:#EAF1DC;color:#4E6B3D;font-size:11px;font-weight:700;padding:6px 4px;border-radius:9px\">🌍 Care for the earth<\u002Fspan>\n          <span style=\"flex:1;text-align:center;background:#F4EBDD;color:#A0713F;font-size:11px;font-weight:700;padding:6px 4px;border-radius:9px\">🤝 Care for people<\u002Fspan>\n          <span style=\"flex:1;text-align:center;background:#F6EFD9;color:#9A7B2E;font-size:11px;font-weight:700;padding:6px 4px;border-radius:9px\">🌾 Fair share<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:11px;margin-bottom:18px\">\n          <div style=\"display:flex;gap:11px;align-items:flex-start\"><span style=\"width:24px;height:24px;border-radius:8px;background:#5E7E4A;color:#F2E9D2;display:grid;place-items:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:12.5px;flex:none\">1<\u002Fspan><div style=\"font-size:13px;line-height:1.5;color:#4A4334\"><b>Build the garden.<\u002Fb> Drag compost, beds, water and habitats onto the plot. Every element teaches you why it matters.<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:11px;align-items:flex-start\"><span style=\"width:24px;height:24px;border-radius:8px;background:#5E7E4A;color:#F2E9D2;display:grid;place-items:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:12.5px;flex:none\">2<\u002Fspan><div style=\"font-size:13px;line-height:1.5;color:#4A4334\"><b>Share, don't just spend.<\u002Fb> Most things can be built through community barter (♻). What you give circulates — and comes back to you.<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:11px;align-items:flex-start\"><span style=\"width:24px;height:24px;border-radius:8px;background:#5E7E4A;color:#F2E9D2;display:grid;place-items:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:12.5px;flex:none\">3<\u002Fspan><div style=\"font-size:13px;line-height:1.5;color:#4A4334\"><b>Take what you need — not more.<\u002Fb> Neighbours leave surplus on the sharing table. Taking only what your garden needs keeps abundance flowing for everyone.<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:11px;align-items:flex-start\"><span style=\"width:24px;height:24px;border-radius:8px;background:#C99A3C;color:#FFF8E8;display:grid;place-items:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:12.5px;flex:none\">4<\u002Fspan><div style=\"font-size:13px;line-height:1.5;color:#4A4334\"><b>Pair up elements — discover guilds. ✦<\u002Fb> In permaculture, good neighbours help each other. Place related elements side by side and see what they create together. There are 7 to find!<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:11.5px;color:#8A7E66;font-style:italic;line-height:1.5;border-top:1px solid #EFE7D6;padding-top:12px;margin-bottom:16px\">In a gift economy, wealth isn't what you keep — it's having enough to give. Watch life arrive as your garden begins to share.<\u002Fdiv>\n        <button onclick=\"{{ onStartIntro }}\" style=\"width:100%;background:linear-gradient(150deg,#688A50,#3F5C33);border:none;color:#F2E9D2;font-weight:700;font-size:15px;padding:13px;border-radius:13px;cursor:pointer;font-family:'Bricolage Grotesque',sans-serif;letter-spacing:.01em;box-shadow:0 10px 22px -10px rgba(63,92,51,.8);transition:transform .15s\" style-hover=\"transform:translateY(-2px)\">{{ introBtnLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ showGuildList }}\" hint-placeholder-val=\"{{ 22){ out.push({key:d.key,def:d,a:best.a,b:best.b}); }\n    });\n    return out;\n  }\n  freshState(intro){return {placed:[],selectedType:null,selectedPlacedId:null,shares:10,budget:300,pool:65,goodwill:0,given:0,awarded:[],toast:null,market:this.freshMarket(),intro:intro,discovered:[],guildCard:null,arrivalQueue:[],sharedActs:0,muted:this.state?!!this.state.muted:false,playerName:this.state?(this.state.playerName||''):'',season:this.state?(this.state.season||'Summer'):'Summer',springBonusDone:false,autumnHarvestDone:false,rakeRewardDone:false,leafPiles:0,returnQueue:[]};}\n  state=this.freshState(true);\n  dragData=null;\n  _n=0;_g=0;\n  STORE='permagarden_v2';\n\n  componentDidMount(){\n    this._esc=(e)=>{if(e.key==='Escape'){this.setState({selectedPlacedId:null,selectedType:null,guildCard:null,guildReview:false,showGuilds:false,showSummary:false,plantType:null,inspectCritter:null,giveMode:false,toast:null});}};\n    window.addEventListener('keydown',this._esc);\n    this._downCap=(e)=>{\n      const t=(e.target&&e.target.closest)?e.target.closest('[data-drag-type],[data-drag-id]'):null;\n      if(!t){ return; }\n      const id=t.getAttribute('data-drag-id');\n      this.nativeDrag(e,t,id?{mode:'move',id:id}:{mode:'add',type:t.getAttribute('data-drag-type')});\n    };\n    document.addEventListener('pointerdown',this._downCap,true);\n    document.addEventListener('mousedown',this._downCap,true);\n    this._dragClear=()=>{ if(this.state.dragType){ this.setState({dragType:null}); } };\n    document.addEventListener('dragend',this._dragClear,true);\n    document.addEventListener('drop',this._dragClear,true);\n    try{\n      const raw=localStorage.getItem(this.STORE);\n      if(raw){\n        const s=JSON.parse(raw);\n        if(s && Array.isArray(s.placed)){\n          this._n=s._n||s.placed.length+10;this._g=s._g||10;\n          const num=(v,d)=>(typeof v==='number'&&isFinite(v))?v:d;\n          let bootSeason='Summer';\n          try{\n            if(sessionStorage.getItem('pg_session')){ bootSeason=s.season||'Summer'; }\n            else { sessionStorage.setItem('pg_session','1'); }\n          }catch(_){}\n          this._suppressFx=true;\n          this.setState({placed:s.placed.filter(p=>p&&this.econ[p.type]),shares:num(s.shares,10),budget:num(s.budget,300),pool:num(s.pool,65),goodwill:num(s.goodwill,0),given:num(s.given,0),awarded:s.awarded||[],market:(s.market||this.freshMarket()).filter(m=>m&&(m.kind!=='item'||this.econ[m.type])),intro:!s.introSeen,discovered:s.discovered||[],sharedActs:num(s.sharedActs,0),muted:!!s.muted,playerName:s.playerName||'',season:bootSeason,springBonusDone:!!s.springBonusDone,autumnHarvestDone:!!s.autumnHarvestDone,rakeRewardDone:!!s.rakeRewardDone,springForageDone:!!s.springForageDone,springSprouts:(bootSeason==='Spring'?3:0),leafPiles:0,returnQueue:[]});\n        }\n      }\n    }catch(e){}\n  }\n  componentWillUnmount(){\n    window.removeEventListener('keydown',this._esc);\n    document.removeEventListener('pointerdown',this._downCap,true);\n    document.removeEventListener('mousedown',this._downCap,true);\n    clearTimeout(this._tt);\n  }\n  nativeDrag(e,src,info){\n    if(e.button!==undefined&&e.button!==0){ return; }\n    if(this._dragActive){ return; }\n    // pointerdown and its mousedown compat event both hit this; take the first only\n    const now=Date.now();\n    if(this._lastDownAt&&now-this._lastDownAt<400&&e.type==='mousedown'){ return; }\n    this._lastDownAt=now;\n    this._dragActive=true;\n    const sx=e.clientX, sy=e.clientY, self=this;\n    let dragging=false, ghost=null;\n    const plotEl=()=>document.querySelector('[data-plot]');\n    const mv=(ev)=>{\n      if(ev.clientX===undefined){ return; }\n      if(!dragging){\n        if(Math.hypot(ev.clientX-sx,ev.clientY-sy)<10){ return; }\n        dragging=true;\n        document.body.style.userSelect='none';\n        document.body.style.cursor='grabbing';\n        const pl=plotEl(); if(pl){ pl.classList.add('plot-drop-hot')
