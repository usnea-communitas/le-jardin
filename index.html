<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Permaculture Garden — Le Jardin</title>
<meta name="description" content="A story-led educational game about designing a living permaculture garden in Menet, France.">
<link rel="preload" href="assets/story/story-01-menet.webp" as="image" type="image/webp" fetchpriority="high">
<link rel="preload" href="assets/fonts/268f057e-7d88-4bfc-af3c-98d4cd308f56.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/048df43a-fe9b-45a8-b411-e39d84d8ca7f.woff2" as="font" type="font/woff2" crossorigin>
<style id="pg-boot-style">
html,body{margin:0;min-height:100%;background:#f4efe3}
#pg-boot{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;background:radial-gradient(circle at 50% 42%,#fbf8f1 0,#f4efe3 56%,#e6ddc8 100%);color:#2c3525;font-family:'Hanken Grotesk',sans-serif}
#pg-boot>div{text-align:center;padding:30px}
#pg-boot svg{width:58px;height:58px;margin-bottom:12px;filter:drop-shadow(0 7px 9px rgba(61,85,47,.2));animation:pgBootLeaf 1.5s ease-in-out infinite}
#pg-boot strong{display:block;font-family:Georgia,serif;font-size:27px;letter-spacing:.01em}
#pg-boot span{display:block;margin-top:7px;color:#6e7d5a;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
#pg-boot p{max-width:390px;margin:12px auto 0;color:#675f50;font-size:14px;line-height:1.45}
#pg-boot button{margin-top:18px;border:1px solid #49673d;border-radius:12px;background:#5e7e4a;color:#fffaf0;padding:10px 18px;font:700 14px 'Hanken Grotesk',sans-serif;cursor:pointer;box-shadow:0 10px 22px -14px rgba(40,60,30,.8)}
#pg-boot button:focus-visible{outline:3px solid #c99a3c;outline-offset:3px}
#pg-boot.pg-boot-error svg{animation:none}
@keyframes pgBootLeaf{50%{transform:translateY(-5px) rotate(3deg)}}
</style>
<script src="lib/living-lesson.js"></script>
<link rel="preload" href="game.fragment.html" as="fetch" crossorigin>
<link rel="preload" href="vendor/react.production.min.js" as="script">
<link rel="preload" href="vendor/react-dom.production.min.js" as="script">
<link rel="preload" href="vendor/dc-runtime.js" as="script">
<script>
(() => {
  const sources = ["vendor/react.production.min.js", "vendor/react-dom.production.min.js", "vendor/dc-runtime.js"];
  const load = (src) => new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = src;
    script.onload = resolve;
    script.onerror = reject;
    document.head.appendChild(script);
  });
  const showError = (error) => {
    console.error("Game failed to start", error);
    const bootScreen = document.getElementById("pg-boot");
    if (!bootScreen) return;
    bootScreen.classList.add("pg-boot-error");
    bootScreen.setAttribute("role", "alert");
    const box = bootScreen.firstElementChild;
    const status = box && box.querySelector("span");
    if (status) status.textContent = "Le Jardin needs another moment";
    if (box && !box.querySelector("[data-pg-boot-detail]")) {
      const detail = document.createElement("p");
      detail.dataset.pgBootDetail = "1";
      detail.textContent = "The game could not finish loading. Check your connection, then try again.";
      const retry = document.createElement("button");
      retry.type = "button";
      retry.dataset.testid = "boot-retry";
      retry.textContent = "Try again";
      retry.addEventListener("click", () => window.location.reload());
      box.append(detail, retry);
      retry.focus();
    }
  };
  const boot = async () => {
    const response = await fetch("game.fragment.html");
    if (!response.ok) throw new Error("Game content could not be loaded");
    document.body.insertAdjacentHTML("beforeend", await response.text());
    await sources.reduce((ready, src) => ready.then(() => load(src)), Promise.resolve());
  };
  requestAnimationFrame(() => requestAnimationFrame(() => boot().catch(showError)));
})();
</script>

</head>
<body>
<div id="pg-boot" role="status" aria-live="polite"><div><svg viewBox="0 0 64 64" fill="none" aria-hidden="true"><path d="M13 52c0-25 15-39 43-41-3 28-18 43-43 41z" fill="#dceac7" stroke="#5e7e4a" stroke-width="4" stroke-linejoin="round"></path><path d="M13 52c7-15 17-25 31-31" stroke="#5e7e4a" stroke-width="4" stroke-linecap="round"></path></svg><strong>Permaculture Garden</strong><span>Preparing Le Jardin…</span></div></div>



</body></html>
